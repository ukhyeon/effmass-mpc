# tuned_d1v075.yml - overnight WP1 DIAGNOSTIC ONLY: profile t1 with speed_cap_v 0.75 m/s. Not for other work packages.
# Keys under settings = step2b option names with "_" (an option given explicitly on the command line wins).
# MPPI settings and the human cost (set A, w 1e5, u nearest, shapes v2, max_all) are not part of the profile and stay as before.
profile: d1v075
date: 2026-11-17
settings:
  speed_cap: "on"          # rollout cost on robot sphere speed near the human
  speed_cap_v: 0.75        # m/s, ISO/TS 15066 hand transient (F_max 280 N, k 75 kN/m) at mu ~ 4.6 kg -> 0.48 m/s, rounded
  speed_cap_dist: 0.4      # m, penalty only for spheres within this shape-based gap of the human
  speed_cap_w: 300000.0    # weight of max(0, v - v_cap)^2 (max over spheres, per rollout step)
  pose_rot_w: 200.0        # pose cost orientation weight (particle_mpc.yml default 60; position weight 300 unchanged)
tuning:
  tried: ["s1 w 1e4 rot 60", "s2 w 1e5 rot 60", "s3 w 3e5 rot 60", "s4 w 3e5 rot 200 (chosen)"]
